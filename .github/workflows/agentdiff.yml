# AgentDiff CI gate — the live statistical gate of this demo.
# Every PR records a fresh candidate trace from the REAL Gemini agent and
# gates it against the committed N-run baseline envelope. The candidate
# artifact is picked up by the /agentdiff approve bot for re-baselining.
#
# Workflows pin the published PyPI package (0.5.0).
# (or pin the version) for reproducible builds.

name: AgentDiff Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      prompt:
        description: "Agent prompt (use the redundant-call prompt to demo a BLOCKED gate)"
        default: ""
      pr:
        description: "PR number to post the report to (dispatch only)"
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  agentdiff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AgentDiff + agent deps
        run: pip install agent-trajectory-diff google-genai

      - name: Check for baseline envelope
        id: base
        run: |
          if [ -f baselines/default.envelope.json ]; then
            echo "has_baseline=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_baseline=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No baseline envelope yet — run 'Record Baseline' (Actions tab) once to bootstrap."
          fi

      - name: Run live agent (real Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROMPT: ${{ inputs.prompt }}
        run: |
          if [ -z "$PROMPT" ]; then
            PROMPT="Retrieve the database count of active users for state NY."
          fi
          python scripts/run_agent.py --prompt "$PROMPT" --out traces/candidate.json

      - name: Upload candidate trace (for /agentdiff approve)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentdiff-candidate-trace
          path: traces/candidate.json
          retention-days: 7

      - name: Gate against baseline envelope
        if: steps.base.outputs.has_baseline == 'true'
        run: agentdiff diff baselines/default.envelope.json traces/candidate.json --scenario default --fail-on-regression

      - name: Publish gate status (always)
        if: always()
        run: |
          python scripts/publish_status.py \
            --baseline baselines/default.envelope.json \
            --candidate traces/candidate.json \
            --config agentdiff.toml --scenario default \
            --out-dir status --history-limit 60

      - name: Push status to the status branch
        if: always() && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          STATUS_DIR="$GITHUB_WORKSPACE/status"
          export GIT_TERMINAL_PROMPT=0
          WORK="$(mktemp -d)"
          cd "$WORK"
          git init -q
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth=1 origin status 2>/dev/null; then
            git checkout -q -B status FETCH_HEAD
          else
            git checkout -q --orphan status
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp "$STATUS_DIR"/latest.json "$STATUS_DIR"/history.json .
          git config user.name "agentdiff-ci[bot]"
          git config user.email "agentdiff-ci[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "status unchanged, nothing to publish"
            exit 0
          fi
          git commit -q -m "status: gate run ${GITHUB_RUN_ID:-local} [skip ci]"
          for attempt in 1 2 3; do
            if git push -q origin status; then
              echo "status branch updated"
              exit 0
            fi
            git fetch -q --depth=1 origin status && git rebase -q FETCH_HEAD || true
            sleep 3
          done
          echo "::warning::status push failed after retries (non-blocking)"

      - name: Post PR report
        if: always() && steps.base.outputs.has_baseline == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.number || inputs.pr }}
        run: |
          if [ -z "$PR_NUM" ]; then
            echo "No PR context — skipping report comment."
            exit 0
          fi
          agentdiff diff baselines/default.envelope.json traces/candidate.json --scenario default --format pr --pr "$PR_NUM"
