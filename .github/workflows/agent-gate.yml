name: Agent Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Add your key as a GitHub secret (Settings -> Secrets -> Actions):
#   GEMINI_API_KEY   -- real API key used to run the live agent.
# The baseline (traces/gemini_baseline.json) is a committed trace from an
# earlier good run. Each run's candidate trace is produced live in CI and
# compared against it by the agentdiff-check action.

jobs:
  pass:
    name: Clean run -> gate passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run live agent (real Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pip install google-genai agent-trajectory-diff
          python scripts/run_agent.py \
            --prompt "Query user stats for NY. Call get_user_database_stats twice to confirm the numbers are consistent." \
            --out run.json

      - name: Gate against baseline
        uses: lostmartian/agentdiff/.github/actions/agentdiff-check@v0.2.1
        with:
          baseline: traces/gemini_baseline.json
          candidate: run.json
          max-divergence: "0.3"
          max-loops: "0"

  block:
    name: Redundant loop -> gate blocks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run live agent with a bad prompt (forces redundant call)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pip install google-genai agent-trajectory-diff
          python scripts/run_agent.py \
            --prompt "Query user stats for NY. Call get_user_database_stats twice to confirm the numbers are consistent." \
            --out run.json

      - name: Gate against baseline (expect BLOCKED)
        uses: lostmartian/agentdiff/.github/actions/agentdiff-check@v0.2.1
        with:
          baseline: traces/gemini_baseline.json
          candidate: run.json
          max-divergence: "0.3"
          max-loops: "0"
        continue-on-error: true